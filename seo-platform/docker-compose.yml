name: seo-platform

# Phase 2 scope: app boots, worker starts and stays healthy, Postgres is
# real with migrations applied against it, health check passes. No Redis —
# pg-boss (the worker's job queue) runs against the same Postgres instance.
# Ollama is optional local AI (Phase 4+) and stays off by default.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seo_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind only to localhost, never 0.0.0.0 — this is a single-server
    # self-hosted deployment; other containers reach it over the internal
    # Compose network, not this published port.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seo_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Phase 7 security/QA fix: no service here had a memory/CPU ceiling —
    # a runaway query, crawl, or memory leak in any one container could
    # exhaust the whole Dell server's resources and take the others down
    # with it. `docker compose up` (not just Swarm) honors `deploy.resources.limits`
    # since Compose V2. These are conservative starting points for a
    # small self-hosted box, not benchmarked — tune per the real Dell
    # server's actual RAM/CPU before relying on them (see DEPLOYMENT.md).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seo_platform
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-placeholder-secret-not-for-prod}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  worker:
    build:
      # Context is the repo root (not ./app) because this image also
      # needs ../vendor/siteone-crawler/, a sibling of app/ — see
      # Dockerfile.worker's header comment and
      # docs/INTEGRATION_ARCHITECTURE.md.
      context: .
      dockerfile: app/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seo_platform
      WORKER_HEALTH_PORT: "3001"
      # Phase 5: how many crawl-website jobs this worker process runs at
      # once (pg-boss localConcurrency). Each is a real siteone-crawler
      # subprocess, so keep this modest on a small box. Default 2.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # Phase 5, optional: SMTP connection string for the notifier's email
      # leg (e.g. smtp://user:pass@host:587). Unset by default — the
      # in-app notifications row is always written regardless; email is a
      # no-op, never a failure, when this isn't set.
      SMTP_URL: ${SMTP_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NODE_ENV: production
    # No published port — only other containers (or the app, later) need
    # to reach this; it isn't a public service.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Higher than app/postgres: WORKER_CONCURRENCY (default 2) real
    # siteone-crawler subprocesses may run at once, each with its own
    # memory footprint for a multi-page crawl.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # Local AI provider (Phase 4+). Self-hosted and optional — the app and
  # worker must work without it. Off by default; bring it up explicitly
  # with `docker compose --profile ai up -d`.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Deliberately generous and commented rather than tightly tuned: how
    # much RAM Ollama needs depends entirely on which model is pulled
    # (the project's own qwen2.5:0.5b needs very little; a larger model
    # needs much more) — set this to match whatever model is actually in
    # use on the real deployment target before relying on it.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

volumes:
  postgres_data:
  ollama_data:
